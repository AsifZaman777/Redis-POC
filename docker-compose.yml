version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: redis-poc-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - redis-net

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight-poc
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis
    volumes:
      - redisinsight-data:/data
    networks:
      - redis-net

volumes:
  redis-data:
  redisinsight-data:

networks:
  redis-net:
    driver: bridge
